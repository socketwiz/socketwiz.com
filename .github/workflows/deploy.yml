on: push
name: Build and deploy on push
jobs:
  build:
    name: shalzz/zola-deploy-action
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: shalzz/zola-deploy-action
      uses: shalzz/zola-deploy-action@v0.19.2
      env:
        PAGES_BRANCH: gh-pages
        BUILD_DIR: .
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ZOLA_VERSION: "0.22.0"
